# 임시 진단용 (#134) — 머지 전 삭제
name: Diag market price
on:
  pull_request:
    branches: ["main"]
jobs:
  diag:
    runs-on: ubuntu-latest
    environment: prd
    env:
      PUBLIC_DATA_API_KEY: ${{ secrets.PUBLIC_DATA_API_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: End-to-end
        run: |
          npm ci --silent
          npm run build > /dev/null
          npx next start -p 3000 > server.log 2>&1 &
          sleep 8
          curl -sS -m 30 "http://localhost:3000/api/announcements" | python3 -c "
          import sys,json; d=json.load(sys.stdin); items=d.get('data',[])
          ids=[(a['id'],a.get('pblancNo',a['id']),a['complexName']) for a in items if '신길' in a['complexName']][:2]
          ids.append(('2026000499','2026000499','한화포레나 지제역'))
          open('ids.txt','w').write('\n'.join('\t'.join(x) for x in ids))"
          while IFS=$'\t' read -r hm pb name; do
            echo "== $name"
            curl -sS -m 60 "http://localhost:3000/api/announcements/market-price?houseManageNo=$hm&pblancNo=$pb" | python3 -c "
          import sys,json; d=json.load(sys.stdin)
          for a,e in (d.get('data') or {}).items():
              if not e: print(a,'None'); continue
              print(f\"{a}㎡ 시세 {e['estimate']} | {e.get('dong') or '시군구'} 신축={e['newOnly']} 중위준공={e['medianBuildYear']} {e['count']}건\")
              for c in e['complexes']: print('   ',c)
          "
          done < ids.txt
