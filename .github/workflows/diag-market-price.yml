# 임시 진단용 (#131) — 머지 전 삭제
name: Diag market price
on:
  pull_request:
    branches: ["main"]
jobs:
  diag:
    runs-on: ubuntu-latest
    environment: prd
    env:
      PUBLIC_DATA_API_KEY: ${{ secrets.PUBLIC_DATA_API_KEY }}
    steps:
      - name: 평택(41220) 106~122㎡ 신축 거래 원본
        run: |
          for ym in 202605 202606 202607 202608 202609 202610; do
            curl -sS -m 30 "https://apis.data.go.kr/1613000/RTMSDataSvcAptTradeDev/getRTMSDataSvcAptTradeDev?serviceKey=$PUBLIC_DATA_API_KEY&LAWD_CD=41220&DEAL_YMD=$ym&numOfRows=1000&pageNo=1" > $ym.xml
          done
          python3 - <<'PY'
          import re,glob
          rows=[]
          for f in sorted(glob.glob('*.xml')):
              for it in re.findall(r'<item>(.*?)</item>', open(f).read(), re.S):
                  g=lambda t:(re.search(f'<{t}>(.*?)</{t}>',it,re.S) or [None,''])[1].strip()
                  a=float(g('excluUseAr') or 0); p=int(g('dealAmount').replace(',','') or 0); y=int(g('buildYear') or 0)
                  if 106<=a<=122 and y>=2016: rows.append((round(p/a),p,a,y,g('aptNm'),g('umdNm'),g('dealYear')+g('dealMonth').zfill(2)+g('dealDay').zfill(2),g('cdealType'),g('dealingGbn'),g('floor')))
          rows.sort()
          for r in rows: print(r)
          print('n=',len(rows))
          PY
