# 임시 진단용 (#120) — 머지 전 삭제
name: Diag market price
on:
  pull_request:
    branches: ["main"]
jobs:
  diag:
    runs-on: ubuntu-latest
    environment: prd
    env:
      PUBLIC_DATA_API_KEY: ${{ secrets.PUBLIC_DATA_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: RTMS 시군구 코드 검증 (202609 거래 건수 + 동 이름 샘플)
        run: |
          check() {
            x=$(curl -sS -m 20 "https://apis.data.go.kr/1613000/RTMSDataSvcAptTradeDev/getRTMSDataSvcAptTradeDev?serviceKey=$PUBLIC_DATA_API_KEY&LAWD_CD=$1&DEAL_YMD=202609&numOfRows=1000&pageNo=1")
            rc=$(echo "$x" | grep -o '<resultCode>[^<]*' | head -1 | cut -d'>' -f2)
            tc=$(echo "$x" | grep -o '<totalCount>[^<]*' | cut -d'>' -f2)
            dongs=$(echo "$x" | grep -o '<umdNm>[^<]*' | cut -d'>' -f2 | sort -u | head -6 | tr '\n' ',')
            echo "CODE $1 rc=$rc total=$tc dongs=$dongs"
          }
          export -f check
          xargs -P 6 -I{} bash -c 'check {}' < .github/diag-codes.txt | sort > result.txt
          echo "== 거래 있는 코드: $(grep -vc 'total=0\|total=$' result.txt)"
          grep -v 'rc=000' result.txt | head -5
          grep -E 'CODE (4119|4159|281|282|27720|51|52)' result.txt | grep -v 'total=0 ' 
          echo "== 거래 0건 (테이블 기준)"; grep 'total=0 ' result.txt | grep -vE 'CODE (281|282)' 
