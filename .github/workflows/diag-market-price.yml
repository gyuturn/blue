# 임시 진단용 (#131) — 머지 전 삭제
name: Diag market price
on:
  pull_request:
    branches: ["main"]
jobs:
  diag:
    runs-on: ubuntu-latest
    environment: prd
    env:
      PUBLIC_DATA_API_KEY: ${{ secrets.PUBLIC_DATA_API_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: End-to-end (최근 공고 + 한화포레나 지제역)
        run: |
          npm ci --silent
          npm run build > /dev/null
          npx next start -p 3000 > server.log 2>&1 &
          sleep 8
          curl -sS -m 30 "http://localhost:3000/api/announcements" | python3 -c "
          import sys,json; d=json.load(sys.stdin); items=d.get('data',d if isinstance(d,list) else [])
          ids=[(a['id'],a.get('pblancNo',a['id']),a['complexName'],a.get('address','')) for a in items][:10]
          ids.insert(0,('2026000499','2026000499','한화포레나 지제역','경기도 평택시 세교동 725번지 일원'))
          open('ids.txt','w').write('\n'.join('\t'.join(x) for x in ids))"
          while IFS=$'\t' read -r hm pb name addr; do
            echo "== $name | $addr"
            curl -sS -m 60 "http://localhost:3000/api/announcements/market-price?houseManageNo=$hm&pblancNo=$pb" | head -c 900; echo
          done < ids.txt
          echo "== server log"; grep -E "market-price|rtms" server.log | tail -20
