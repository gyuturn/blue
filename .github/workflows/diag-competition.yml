name: Diag competition API
on:
  pull_request:
    branches: ["main"]
jobs:
  diag:
    runs-on: ubuntu-latest
    environment: prd
    steps:
      - name: Call odcloud directly with production key
        env:
          KEY: ${{ secrets.PUBLIC_DATA_API_KEY }}
        run: |
          echo "key length: ${#KEY}"
          [ -n "$KEY" ] || exit 1
          call() {
            echo "=== $1 ==="
            curl -sS "https://api.odcloud.kr/api/$1?serviceKey=${KEY}&page=1&perPage=2&returnType=JSON&$2" -o out.json -w "HTTP %{http_code}\n"
            B=$(head -c 1200 out.json); echo "${B//$KEY/***}"
          }
          call ApplyhomeInfoDetailSvc/v1/getAPTLttotPblancDetail ""
          call ApplyhomeInfoCmpetRtSvc/v1/getAPTLttotPblancCmpet ""
          call ApplyhomeInfoCmpetRtSvc/v1/getAptLttotPblancScore ""
          call ApplyhomeInfoCmpetRtSvc/v1/getAPTLttotPblancScore ""
          call ApplyhomeInfoCmpetRtSvc/v1/getAPTLttotPblancCmpet "cond%5BHOUSE_MANAGE_NO%3A%3AEQ%5D=2026000201"
          call NoSuchServiceXyz/v1/getNothing ""
          echo "=== swagger 42105 paths ==="
          curl -sS "https://infuser.odcloud.kr/api/stages/42105/api-docs" -o sw.json -w "HTTP %{http_code}\n"
          jq -r '.info.title, (.paths | keys[])' sw.json 2>/dev/null | head -20 || head -c 800 sw.json
